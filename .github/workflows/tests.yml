name: tests
on: [push, pull_request]

env:
  # Folder (inside the repo) that contains requirements.txt, app/ and tests/.
  # Change this if your backend folder has a different name.
  BACKEND_DIR: ticket-booking-system

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.BACKEND_DIR }}/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Start API
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          APP_ENV: development
          RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret
        run: |
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break || sleep 1; done

      - name: Run tests
        env:
          SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.TEST_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
          RAZORPAY_WEBHOOK_SECRET: ci_webhook_secret
          API_BASE_URL: http://localhost:8000
        run: pytest

      - name: Show API log on failure
        if: failure()
        run: cat api.log